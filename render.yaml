# Render Blueprint — one-click deploy: https://render.com/deploy?repo=https://github.com/raghav772-a/stockledger
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: stockledger-db
    plan: free
    databaseName: inventory_db
    user: stockledger

services:
  - type: web
    name: stockledger-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: stockledger-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: stockledger-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: AUTO_SEED
        value: "true"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://stockledger-web.onrender.com

  - type: web
    name: stockledger-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://stockledger-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
